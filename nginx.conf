server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # App shell (html/js/css) must always be fresh — otherwise a CDN/browser can
    # pin an old app.js and users keep running outdated draw rules. no-store keeps
    # Cloudflare from caching these; the formation tiles below stay cached.
    add_header Cache-Control "no-store" always;

    # simple health endpoint for k8s probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # formation tiles never change under a given tag — cache hard
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
